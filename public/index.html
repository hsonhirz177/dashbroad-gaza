<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaza Security - حماية سيرفرات ديسكورد</title>
    <!-- استدعاء أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Tahoma, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .container {
            background: #1e293b;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.6;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-discord {
            background-color: #5865F2;
            color: white;
        }
        .btn-discord:hover {
            background-color: #4752C4;
        }
        .btn-dashboard {
            background-color: #0284c7;
            color: white;
        }
        .btn-dashboard:hover {
            background-color: #0369a1;
        }
        .stats {
            margin-top: 25px;
            font-size: 14px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛡️ Gaza Security</h1>
        <p>البوت الاحترافي لحماية سيرفرات ديسكورد على مدار الساعة ضد التخريب، سرقة الروابط، والبوتات الوهمية.</p>
        
        <div class="buttons">
            <!-- زر تسجيل الدخول بواسطة ديسكورد -->
            <a href="/auth/discord" class="btn btn-discord">
                <i class="fab fa-discord"></i> تسجيل الدخول بواسطة ديسكورد
            </a>
            
            <!-- زر الانتقال للوحة التحكم -->
            <a href="/dashboard.html" class="btn btn-dashboard">
                <i class="fa-solid fa-gauge-high"></i> لوحة التحكم
            </a>
        </div>

        <div class="stats" id="bot-stats">
            جاري تحميل إحصائيات البوت...
        </div>
    </div>

    <script>
        // جلب إحصائيات البوت من الـ API وعرضها مباشرة في الموقع
        fetch('/api/stats')
            .then(res => res.json())
            .then(data => {
                if (data.online) {
                    document.getElementById('bot-stats').innerHTML = 
                        `🌐 يحمي حالياً <b>${data.servers}</b> سيرفر | 👥 <b>${data.users}</b> عضو`;
                } else {
                    document.getElementById('bot-stats').innerHTML = '⚠️ البوت غير متصل حالياً.';
                }
            })
            .catch(() => {
                document.getElementById('bot-stats').innerHTML = '❌ تعذر جلب الإحصائيات.';
            });
    </script>

</body>
</html>
